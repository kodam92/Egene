<style>
  * { box-sizing: border-box; }
  .process-wrap {
    width: 100%;
    max-width: 1600px;
    margin: 40px auto;
    background: #fff;
    border-radius: 10px;
    padding: 30px 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }
  .process-flow {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;      /* 🔥 줄별 가운데 정렬 */
    gap: 40px;                    /* 아이템 간 간격 */
  }
  .step-item {
    position: relative;
    flex: 0 0 auto;               /* 🔥 고정폭 제거 → 화면 넓으면 한 줄 */
    display: inline-flex;
    justify-content: center;
  }
  .step-box {
    background: linear-gradient(135deg, #4e89ae, #4e89ae);
    color: #fff;
    padding: 12px 15px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
    text-align: center;
  }
  .step-title { display: block; }
  .step-sub { display: block; font-size: 11px; opacity: .9; margin-top: 2px; }
  /* -------- 화살표 (아이템 왼쪽에 붙음) -------- */
  .step-item::before,
  .step-item::after {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }
  /* 선 */
  .step-item::before {
    left: -28px;
    width: 16px;
    height: 5px;
    background: linear-gradient(90deg, #4e89ae, #4e89ae);
  }
  /* 삼각형 */
  .step-item::after {
    left: -14px;
    border-left: 9px solid #4e89ae;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  /* 첫 번째는 화살표 제거 */
  .step-item:first-child::before,
  .step-item:first-child::after {
    content: none;
  }
</style>
<div class="process-wrap">
  <div class="process-flow">
<div class="step-item"><div class="step-box"><span class="step-title">요청등록</span><span class="step-sub">요청자</span></div></div>
<div class="step-item"><div class="step-box"><span class="step-title">요청 등록 승인</span><span class="step-sub">요청부서 팀장</span></div></div>
<div class="step-item"><div class="step-box"><span class="step-title">요청 접수</span><span class="step-sub">NW_담당그룹/라원수,이건우,최현수</span></div></div>
<div class="step-item"><div class="step-box"><span class="step-title">요청 접수 승인</span><span class="step-sub">NW담당부서장/김종훈</span></div></div>
<div class="step-item"><div class="step-box"><span class="step-title">운영반영</span><span class="step-sub">NW_운영반영그룹/라원수,이건우,최현수</span></div></div>
<div class="step-item"><div class="step-box"><span class="step-title">요청 처리완료 확인</span><span class="step-sub">요청자</span></div></div>
<div class="step-item"><div class="step-box"><span class="step-title">종료</span><span class="step-sub">요청 부서</span></div></div>
  </div>
</div>
